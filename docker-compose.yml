services:
  brain:
    build: .
    container_name: empresa-brain
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"        # API HTTP (para el conector MCP de Claude)
    volumes:
      - ./data:/app/data    # la base de conocimiento persiste aquí
      - ./brain:/app/brain  # código en vivo: ajustes sin rebuild (git pull + restart)
